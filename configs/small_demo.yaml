# Tiny end-to-end demo. Target: finish in under 3 minutes on a laptop CPU.
# All material properties and boundary values below are ILLUSTRATIVE / configurable
# unless a cited source is given in docs/references.md.

seed: 7
name: small_demo
output_dir: outputs/small_demo
overwrite: true

domain:
  shape: [16, 16, 16]
  voxel_length_m: 5.0e-5   # 50 micrometers; illustrative discretization

microstructure:
  n_samples: 12
  porosity_range: [0.70, 0.88]
  fiber_radius_voxels_range: [1.0, 1.6]
  in_plane_spread_deg_range: [15.0, 60.0]
  out_of_plane_spread_deg_range: [8.0, 35.0]
  porosity_tolerance: 0.12
  max_generation_attempts: 8
  n_fibers_max: 80
  fiber_length_voxels: 20.0

diffusion:
  n_time_steps: 18
  dt_s: 2.0e-4
  diffusivity_m2_s_range: [2.0e-8, 8.0e-8]
  reaction_rate_1_s_range: [8.0, 40.0]
  z_max_bc: zero_flux          # zero_flux | fixed_zero | fixed_one
  oxidation_threshold: 0.05
  enable_degradation: false
  degradation_damage_threshold: 0.8
  degradation_max_fraction: 0.02
  snapshot_times: [0.25, 0.5, 1.0]

conductivity:
  k_solid_w_m_k: 8.0           # illustrative carbon-fiber solid
  k_pore_w_m_k: 0.03           # illustrative pore-gas
  solver: cg                   # cg | bicgstab
  tol: 1.0e-6
  maxiter: 2000
  k_bounds_w_m_k: [1.0e-4, 50.0]

dataset:
  train_fraction: 0.60
  val_fraction: 0.20
  test_fraction: 0.20
  n_cv_folds: 4
  n_cv_repeats: 2

model:
  random_forest:
    n_estimators: 40
    max_depth: 8
    min_samples_leaf: 1
  hist_gbm:
    max_depth: 4
    max_iter: 40
    learning_rate: 0.12

optimization:
  n_candidates: 24
  n_confirm: 4
  seed: 11

evaluation:
  mape_eps: 1.0e-8
